<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- viewport: pastikan halaman responsif di berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Anggota</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS: override warna brand SIMPUS-Mini -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- =============================================
         HEADER & NAVBAR RESPONSIF
         ---------------------------------------------
         Navbar konsisten di semua halaman. Menu "Daftar Anggota"
         ditandai aktif (nav-link active) di halaman ini.
         ============================================= -->
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>

            <!-- Tombol hamburger untuk mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu navigasi -->
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- =============================================
         MAIN CONTENT: DAFTAR ANGGOTA
         ---------------------------------------------
         Tabel data anggota perpustakaan.
         Menggunakan komponen table Bootstrap:
         - table-striped: baris bergantian warna (zebra)
         - table-hover: efek highlight saat cursor diarahkan
         - table-responsive: scroll horizontal di mobile
         ============================================= -->
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#1d5b8a;">Daftar Anggota</h2>

                <!-- .table-responsive: tabel bisa di-scroll di layar kecil -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">

                        <!-- Header tabel: background biru brand, teks putih -->
                        <thead style="background-color:#1d5b8a;">
                            <tr class="text-white">
                                <th>No. Anggota</th>
                                <th>Nama</th>
                                <th>Alamat</th>
                                <th>No. HP</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- Baris 1: Siti Aminah -->
                            <tr>
                                <td>A001</td>
                                <td>Siti Aminah</td>
                                <td>Malang</td>
                                <td>0812xxxx</td>
                                <td>
                                    <button type="button" class="btn btn-warning btn-sm text-white">Edit</button>
                                    <button type="button" class="btn btn-danger btn-sm">Hapus</button>
                                </td>
                            </tr>

                            <!-- Baris 2: Budi Santoso -->
                            <tr>
                                <td>A002</td>
                                <td>Budi Santoso</td>
                                <td>Batu</td>
                                <td>0813xxxx</td>
                                <td>
                                    <button type="button" class="btn btn-warning btn-sm text-white">Edit</button>
                                    <button type="button" class="btn btn-danger btn-sm">Hapus</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <!-- Bootstrap JS bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
