<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- viewport: pastikan halaman responsif di berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS: override warna brand SIMPUS-Mini -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- =============================================
         HEADER & NAVBAR RESPONSIF
         ---------------------------------------------
         Navbar konsisten di semua halaman. Menu "Tambah Anggota"
         ditandai aktif (nav-link active) di halaman ini.
         ============================================= -->
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>

            <!-- Tombol hamburger untuk mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu navigasi -->
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- =============================================
         MAIN CONTENT: FORM TAMBAH ANGGOTA
         ---------------------------------------------
         Formulir untuk menambah data anggota baru.
         Menggunakan utility class Bootstrap:
         - .mb-3: margin bawah 1rem antar field
         - .form-label: styling label form
         - .form-control: styling input fields
         - .fw-semibold: teks label tebal (semi-bold)
         ============================================= -->
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#1d5b8a;">Tambah Anggota</h2>
                <form>

                    <!-- Field 1: Nama Lengkap (wajib diisi) -->
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold">Nama</label>
                        <input type="text" class="form-control" id="nama" name="nama" required>
                    </div>

                    <!-- Field 2: Nomor Anggota (wajib diisi, format: Axxx) -->
                    <div class="mb-3">
                        <label for="no_anggota" class="form-label fw-semibold">No. Anggota</label>
                        <input type="text" class="form-control" id="no_anggota" name="no_anggota" required>
                    </div>

                    <!-- Field 3: Alamat (opsional) -->
                    <div class="mb-3">
                        <label for="alamat" class="form-label fw-semibold">Alamat</label>
                        <input type="text" class="form-control" id="alamat" name="alamat">
                    </div>

                    <!-- Field 4: Nomor HP (opsional) -->
                    <div class="mb-3">
                        <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                        <input type="text" class="form-control" id="no_hp" name="no_hp">
                    </div>

                    <!-- Tombol Simpan: warna biru brand -->
                    <button type="submit" class="btn" style="background-color:#1d5b8a; color:#fff;">Simpan</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <!-- Bootstrap JS bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
